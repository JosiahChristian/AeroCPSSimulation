name: Autonomy Guidance Core Validation Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Compile Standalone Flight Simulator Engine
      run: g++ run_standalone.cpp -o run_simulation.exe

    - name: Execute Automated Flight Trajectory Tests
      run: ./run_simulation.exe

    - name: Automatically Upload and Archive Telemetry Test Logs
      uses: actions/upload-artifact@v4
      with:
        name: cloud-telemetry-run-log
        path: test_logs/flight_telemetry_run_history.txt
