name: C++ Simulation Engine CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Enforces cross-compiler compatibility (crucial for embedded/CPS engineering)
        compiler: [ {cc: gcc, cxx: g++}, {cc: clang, cxx: clang++} ]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Build Toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libgtest-dev

    - name: Configure CMake
      env:
        CC: ${{ matrix.compiler.cc }}
        CXX: ${{ matrix.compiler.cxx }}
      # Sets build type to Debug to preserve symbols for tests, enables warning flags
      run: |
        cmake -B build -S . \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror -Wpedantic"

    - name: Compile Code Base
      # Compiles using all available processor cores on the GitHub runner
      run: cmake --build build --parallel $(nproc)

    - name: Run Test Suite (CTest)
      # Executes all unit tests registered via add_test() in your CMakeLists.txt
      # --output-on-failure dumps stdout/stderr directly into logs if a solver fails
      run: |
        if [ -d "build" ]; then
          cd build && ctest --output-on-failure
        fi