#include <iostream>
#include <fstream>
#include <vector>
#include <cmath>
#include <sys/stat.h> // Standard universal directory library matrix

int main() {
    // Universal Cross-Platform Directory Creator Loop
#if defined(_WIN32)
    mkdir("test_logs");
#else
    mkdir("test_logs", 0777); // Enforces Linux server folder permissions cleanly
#endif

    std::cout << "[SYSTEM] Initializing high-fidelity aerospace simulation core...\n";
    
    // Open a persistent file output stream channel
    std::ofstream logFile("test_logs/flight_telemetry_run_history.txt");
    
    if (!logFile.is_open()) {
        std::cerr << "❌ CRITICAL ERROR: Could not open file stream. Aborting.\n";
        return 1;
    }

    logFile << "===============================================================\n";
    logFile << "     ODU FLIGHT TELEMETRY SIMULATION ARCHIVE RUN PROFILE       \n";
    logFile << "===============================================================\n";

    double targetAlt = 50.0;
    double currentAlt = 0.0;
    double velocity = 0.0;
    double timeStep = 0.05;

    for (int step = 0; step < 15; ++step) {
        double error = targetAlt - currentAlt;
        double thrust = error * 0.4;
        double gravity = -3.711; // Mars Research Constants
        double acceleration = thrust + gravity;

        velocity += acceleration * timeStep;
        currentAlt += velocity * timeStep;

        if (currentAlt < 0.0) { currentAlt = 0.0; velocity = 0.0; }

        std::cout << "Flight Step " << step << " | Current Altitude: " << currentAlt << " m\n";
        logFile << "Flight Step " << step << " | Altitude: " << currentAlt << " m | Velocity: " << velocity << " m/s\n";
    }

    logFile << "---------------------------------------------------------------\n";
    logFile << "[SYSTEM] Target trajectory lifecycle complete.\n";
    logFile.close();

    std::cout << "🚀 Success! Trajectory logs locked into: 'test_logs/flight_telemetry_run_history.txt'\n";
    return 0;
}
