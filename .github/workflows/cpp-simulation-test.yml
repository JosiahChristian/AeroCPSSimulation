name: C++ build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Verify install package
        run: cmake --install build --config Release --prefix install
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  sanitizer-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake --preset sanitizers
      - name: Build
        run: cmake --build --preset sanitizers
      - name: Test
        run: ctest --preset sanitizers
